<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respira Carbono · Segure o carbono na terra</title>
<style>
:root{--main:#2e7d32;--deep:#1b5e20;--soft:#e8f5e9;--line:#d6e8d7;--ink:#1f2d22;--mut:#5d6f60;--bad:#c62828}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.wrap>*{min-width:0}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}
h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
.meter{margin:4px 0 10px}
.meter .lab{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem}
.track{position:relative;height:18px;border-radius:10px;background:#eef3ee;overflow:hidden;margin-top:4px}
.track i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#66bb6a,#ffa726,#e53935);transition:width .25s}
.track b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--deep)}
#campo{position:relative;height:340px;border-radius:18px;overflow:hidden;border:2px solid var(--line);
 background:linear-gradient(180deg,#e3f2fd 0%,#e3f2fd 30%,#c5e1a5 30%,#aed581 70%,#bcaaa4 70%,#a1887f 100%);touch-action:manipulation;user-select:none}
#campo .z{position:absolute;left:8px;font-size:.72rem;font-weight:800;color:rgba(31,45,34,.55);letter-spacing:.5px}
.it{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.75);
 font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18);animation:pop .25s}
.it .ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid transparent;border-top-color:var(--c,#e53935);transform:rotate(var(--a,0deg))}
.it.bad{background:rgba(255,235,238,.95)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.tree{position:absolute;font-size:26px;transform:translate(-50%,-100%);pointer-events:none}
.fx{position:absolute;font-weight:800;pointer-events:none;animation:up .9s forwards;font-size:1rem}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0;font-size:.9rem}
.legend div{background:#f6faf6;border-radius:10px;padding:7px 9px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:1rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt:hover{border-color:var(--main)}.opt.right{border-color:#2e7d32;background:#e8f5e9}.opt.wrong{border-color:var(--bad);background:#ffebee}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:.96rem;display:none}
.fb.good{display:block;background:#e8f5e9;color:#1b5e20}.fb.bad{display:block;background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.fases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.fases div{background:#f4f9f4;border-radius:12px;padding:10px 6px;text-align:center;font-size:.82rem;font-weight:700;color:var(--deep)}
.fases div span{display:block;font-size:1.5rem}
.q{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--main);color:var(--deep);background:#fff;font-weight:800;cursor:pointer;font-size:.85rem;margin-left:6px}
.memo{display:none;background:#f4f9f4;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem;color:var(--mut)}.memo.on{display:block}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.pos{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
@media(max-width:560px){.fases{grid-template-columns:repeat(2,1fr)}#campo{height:300px}h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🌍 Respira Carbono</h1>
  <div class="hud" id="hud" style="display:none">
    <span class="pill" id="hF">Fase 1/4</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hT">⏱ 45 s</span>
  </div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox">
  <h3>Ranking Global</h3>
  <ol id="rankList"><li><span>Carregando o ranking...</span></li></ol>
  <p class="small" id="rankNote"></p>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Tipos de objeto. vida = segundos até sumir. */
const TIPOS={
 fogo:{ic:'🔥',zona:'mata',bom:true,vida:3.2,pts:10,txt:'Fogo apagado'},
 desmate:{ic:'🪓',zona:'mata',bom:true,vida:3.6,pts:10,txt:'Desmate impedido'},
 muda:{ic:'🌱',zona:'solo',bom:true,vida:4,pts:5,txt:'Muda plantada'},
 folha:{ic:'🍂',zona:'solo',bom:true,vida:4,pts:5,txt:'Folhiço no solo'},
 lixo:{ic:'🦜',zona:'mata',bom:false,vida:3,pts:-10,txt:'Deixe o bicho em paz'},
 queima:{ic:'🐊',zona:'solo',bom:false,vida:3,pts:-10,txt:'Deixe o bicho em paz'}
};
/* Faixa de CO2 é um índice do jogo, de 0 a 100. Não é ppm. */
const FASES=[
 {nome:'Mata em pé',ico:'🌳',meta:45,dur:45,arv:6,ritmo:1.25,mix:{muda:3,folha:3,fogo:2,lixo:1},emis:.42,
  txt:'A mata está em pé. Plante mudas e deixe as folhas virarem solo. Apague o fogo que aparecer.',
  q:{p:'Para onde vai boa parte do carbono das folhas que caem?',o:[{t:'Vira matéria orgânica e fica guardado no solo',ok:1},{t:'Some, porque folha seca não tem carbono',ok:0},{t:'Vai direto para o fundo dos rios como petróleo',ok:0}],e:'Folhas e galhos caídos se decompõem aos poucos. Parte do carbono volta ao ar, e parte fica no solo como matéria orgânica.'}},
 {nome:'Seca',ico:'☀️',meta:55,dur:45,arv:6,ritmo:1.05,mix:{fogo:4,muda:2,folha:2,queima:1},emis:.48,absMult:.6,
  txt:'Chegou a seca. As plantas fazem menos fotossíntese e o fogo aparece mais. Seja rápido.',
  q:{p:'Por que a seca deixa o fogo mais perigoso?',o:[{t:'A vegetação seca pega fogo e espalha as chamas com facilidade',ok:1},{t:'O calor do sol acende o capim sozinho todos os dias',ok:0},{t:'Na seca o ar tem mais oxigênio que na chuva',ok:0}],e:'Capim e folhas secas viram combustível. Quase todo incêndio no Pantanal começa por ação humana, e a seca ajuda a espalhar.'}},
 {nome:'Fronteira do desmate',ico:'🪓',meta:55,dur:45,arv:7,ritmo:.95,mix:{desmate:5,fogo:3,muda:2,lixo:1,queima:1},emis:.5,
  txt:'A motosserra chegou. Impeça o desmate antes que a árvore caia e mantenha o fogo longe.',
  q:{p:'Derrubar e queimar a mata faz o que com o carbono das árvores?',o:[{t:'Manda boa parte dele para o ar como CO₂',ok:1},{t:'Guarda o carbono para sempre nas cinzas',ok:0},{t:'Transforma o carbono em oxigênio puro',ok:0}],e:'O tronco, os galhos e as folhas guardam carbono. Queimados ou apodrecendo, liberam esse carbono como CO₂.'}},
 {nome:'Tudo junto',ico:'🔥',meta:55,dur:50,arv:6,ritmo:.8,mix:{fogo:5,desmate:4,muda:2,folha:2,lixo:1,queima:1},emis:.55,absMult:.8,
  txt:'Última fase. Fogo, desmate e seca ao mesmo tempo. Segure o carbono na terra.',
  q:{p:'Qual atitude guarda mais carbono a curto prazo?',o:[{t:'Proteger a mata que já existe',ok:1},{t:'Derrubar e plantar mudas novas no lugar',ok:0},{t:'Queimar o pasto todo ano para renovar',ok:0}],e:'Uma muda leva anos para guardar o que uma árvore adulta já guarda. Por isso proteger a mata em pé vem primeiro.'}}
];

let S,loopId=null,last=0;
function hud(){$('hud').style.display='flex';$('hF').textContent=FASES[S.f].ico+' Fase '+(S.f+1)+'/4';$('hP').textContent=(S.tot+S.fp)+' pts';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.t))+' s';}
function memo(id,t){return `<button class="q" onclick="$('${id}').classList.toggle('on')">?</button><div class="memo" id="${id}">${t}</div>`;}

function inicio(){
 $('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Segure o carbono na terra</h2>
 <p>Árvores, capim e solo guardam carbono. Fogo e desmate mandam esse carbono para o ar como CO₂. Toque rápido para proteger a paisagem.</p>
 <div class="legend">
  <div>🔥 Apague o fogo · +10</div><div>🪓 Impeça o desmate · +10</div>
  <div>🌱 Plante a muda · +5</div><div>🍂 Deixe a folha no solo · +5</div>
  <div>🦜 e 🐊: não toque nos bichos · −10</div><div>Deixou passar 🔥 ou 🪓 · −5</div>
 </div>
 <p class="small">🎯 Meta: terminar cada fase com o CO₂ abaixo da linha. No fim de cada fase há uma pergunta, que vale +20 ou −10.</p>
 <div class="fases">${FASES.map(F=>`<div><span>${F.ico}</span>${F.nome}</div>`).join('')}</div>
 <button class="btn" onclick="novo()">Começar →</button></div>`;
}
function novo(){S={f:0,tot:0,fp:0,erros:0};salvo=false;$('rankBox').style.display='none';abertura();}
function abertura(){
 const F=FASES[S.f];S.fp=0;S.t=F.dur;hud();
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${F.ico}</div><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p>
 <p class="small" style="margin-top:8px">🎯 Termine com o CO₂ abaixo de ${F.meta}.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="jogar()">Jogar →</button></div></div>`;
}
function jogar(){
 const F=FASES[S.f];
 S.co2=40;S.t=F.dur;S.arv=[];S.its=[];S.spawn=.6;S.fim=false;
 $('tela').innerHTML=`<div class="meter"><div class="lab"><span>🌫️ CO₂ no ar ${memo('m1','O CO₂ do jogo é um índice de 0 a 100, não um valor medido. Ele sobe com o fogo e o desmate e desce com a fotossíntese das árvores.')}</span><span id="co2v">40</span></div>
 <div class="track"><i id="co2b"></i><b style="left:${F.meta}%"></b></div><div class="small">A linha escura é a meta: ${F.meta}.</div></div>
 <div id="campo"><span class="z" style="top:6px">ATMOSFERA</span><span class="z" style="top:31%">MATA E CAMPO</span><span class="z" style="top:71%">SOLO</span></div>`;
 const c=$('campo');
 for(let i=0;i<F.arv;i++)plantar(rr(.08,.92),true);
 last=performance.now();cancelAnimationFrame(loopId);loopId=requestAnimationFrame(tick);
}
function plantar(fx,inicial){const c=$('campo');const a={x:fx,y:rr(.5,.66),grow:inicial?1:0};const el=document.createElement('div');el.className='tree';el.textContent=inicial?'🌳':'🌱';el.style.left=(a.x*100)+'%';el.style.top=(a.y*100)+'%';c.appendChild(el);a.el=el;S.arv.push(a);}
function fx(x,y,t,cor){const c=$('campo');const d=document.createElement('div');d.className='fx';d.textContent=t;d.style.color=cor;d.style.left=x+'px';d.style.top=y+'px';c.appendChild(d);setTimeout(()=>d.remove(),900);}
function sortear(){const F=FASES[S.f];const bag=[];for(const k in F.mix)for(let i=0;i<F.mix[k];i++)bag.push(k);return bag[Math.floor(Math.random()*bag.length)];}
function nasce(){
 const k=sortear(),T=TIPOS[k],c=$('campo'),W=c.clientWidth,H=c.clientHeight;
 const y=T.zona==='mata'?rr(.36,.62):rr(.76,.9),x=rr(.1,.9);
 const el=document.createElement('div');el.className='it'+(T.bom?'':' bad');el.innerHTML=`<span class="ring"></span>${T.ic}`;
 el.style.left=(x*W)+'px';el.style.top=(y*H)+'px';c.appendChild(el);
 const it={k,T,el,vida:T.vida,max:T.vida,x:x*W,y:y*H};S.its.push(it);
 el.addEventListener('pointerdown',e=>{e.preventDefault();toque(it);});
}
function toque(it){
 if(it.feito||S.fim)return;it.feito=true;it.el.remove();
 const T=it.T;S.fp+=T.pts;
 if(T.bom){beep(760,.1);fx(it.x,it.y-30,'+'+T.pts,'#1b5e20');
  if(it.k==='fogo'||it.k==='desmate')S.co2=Math.max(0,S.co2-1);
  if(it.k==='muda')plantar(it.x/$('campo').clientWidth,false);
  if(it.k==='folha')S.co2=Math.max(0,S.co2-.6);
 }else{S.erros++;beep(170,.3);fx(it.x,it.y-30,T.pts+' '+T.txt,'#c62828');}
 hud();
}
function tick(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const F=FASES[S.f];
 S.t-=dt;
 /* árvores crescem */
 let abs=0;for(const a of S.arv){if(a.grow<1){a.grow=Math.min(1,a.grow+dt/6);if(a.grow>=1)a.el.textContent='🌳';else if(a.grow>.5)a.el.textContent='🌿';}abs+=a.grow;}
 const fogos=S.its.filter(i=>!i.feito&&i.k==='fogo').length;
 S.co2+= (F.emis + fogos*.6 - abs*.05*(F.absMult||1))*dt;
 S.co2=Math.max(0,Math.min(100,S.co2));
 /* objetos */
 S.spawn-=dt;if(S.spawn<=0&&S.t>1.5){nasce();S.spawn=F.ritmo*rr(.7,1.3);}
 for(const it of S.its){if(it.feito)continue;it.vida-=dt;const ring=it.el.querySelector('.ring');ring.style.setProperty('--a',(360*(1-it.vida/it.max))+'deg');ring.style.setProperty('--c',it.T.bom?'#2e7d32':'#9e9e9e');
  if(it.vida<=0){it.feito=true;it.el.remove();
   if(it.k==='fogo'){S.co2+=4;S.fp-=5;S.erros++;fx(it.x,it.y-30,'🔥 −5','#c62828');beep(200,.2);queimarArvore();}
   else if(it.k==='desmate'){S.co2+=4;S.fp-=5;S.erros++;fx(it.x,it.y-30,'🪓 −5','#c62828');beep(200,.2);queimarArvore();}
  }}
 S.its=S.its.filter(i=>!i.feito);
 const v=Math.round(S.co2);$('co2v').textContent=v;$('co2b').style.width=v+'%';hud();
 if(S.t<=0){fimFase();return;}
 loopId=requestAnimationFrame(tick);
}
function queimarArvore(){const a=S.arv.find(x=>x.grow>=1);if(!a)return;a.el.textContent='🪵';a.grow=0;a.dead=true;S.arv=S.arv.filter(x=>x!==a);}
function fimFase(){
 S.fim=true;cancelAnimationFrame(loopId);const F=FASES[S.f],ok=S.co2<=F.meta,bonus=ok?30:0;S.fp+=bonus;hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'✅ CO₂ abaixo da meta':'⚠️ CO₂ acima da meta'}</h2>
 <p>Você terminou com CO₂ em ${Math.round(S.co2)}. A meta era ${F.meta}. ${ok?'+30 pontos.':''}</p>
 <p style="margin-top:12px"><b>${F.q.p}</b></p><div class="opts">${shuf(F.q.o).map(o=>`<button class="opt" data-ok="${o.ok}">${o.t}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
 const bs=[...document.querySelectorAll('.opt')];
 bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('right');});const c=b.dataset.ok==='1';if(!c){b.classList.add('wrong');S.erros++;}S.fp+=c?20:-10;hud();
  $('fb').className='fb '+(c?'good':'bad');
  const ult=S.f===FASES.length-1;
  $('fb').innerHTML=(c?'Certo! +20. ':'Não foi dessa vez. −10. ')+F.q.e+`<div class="row" style="margin-top:10px">${ok?(ult?'<button class="btn" id="bp">Ver resultado →</button>':'<button class="btn" id="bp">Próxima fase →</button>'):'<button class="btn" id="bp">Tentar a fase de novo</button><button class="btn ghost" id="bq">Encerrar</button>'}</div>`;
  $('bp').onclick=()=>{if(ok){S.tot+=S.fp;S.fp=0;if(ult)final();else{S.f++;abertura();}}else abertura();};
  if($('bq'))$('bq').onclick=()=>final(true);
 });
}
function final(parou){
 $('rankBox').style.display='block';const nivel=parou?'Fase '+(S.f+1):'Todas as fases';S.fp=0;hud();
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${parou?'🌱':'🏆'}</div><h2>${parou?'Fim de jogo':'Você segurou o carbono na terra!'}</h2>
 <div class="big">${S.tot} pts</div><p class="small">${S.erros} erro(s) · chegou até: ${nivel}</p>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}

/* Ranking */
const firebaseConfig={apiKey:"AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",authDomain:"jogos-ranking.firebaseapp.com",projectId:"jogos-ranking",storageBucket:"jogos-ranking.firebasestorage.app",messagingSenderId:"958784915420",appId:"1:958784915420:web:4212d3ad278f02d600f119"};
const GAME_ID="respira-carbono";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="pos">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
